<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAFS 多人即時對戰遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .hidden { display: none !important; }
        .progress-transition { transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 全局載入指示器 -->
    <div id="loading-screen" class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-indigo-600 mx-auto mb-4"></div>
        <p class="text-slate-500 font-bold">正在連接至 BAFS 伺服器...</p>
    </div>

    <!-- 遊戲大廳 (Lobby) -->
    <div id="lobby-view" class="hidden w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 space-y-8 border border-indigo-50">
        <div class="text-center">
            <div class="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fas fa-bolt text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-black text-gray-800">BAFS 即時對戰</h1>
            <div class="flex items-center justify-center gap-2 mt-2">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <p class="text-slate-500 text-sm font-bold">目前全服線上人數：<span id="global-online-count" class="text-indigo-600">0</span> 人</p>
            </div>
        </div>

        <div class="space-y-4">
            <div class="space-y-1">
                <label class="text-sm font-bold text-gray-600 ml-1">玩家暱稱</label>
                <input type="text" id="player-name" placeholder="輸入名稱..." 
                    class="w-full p-4 bg-gray-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white rounded-2xl outline-none transition-all font-bold">
            </div>
            <button id="btn-create" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-95">
                建立對戰房間
            </button>
            <div class="flex items-center gap-2 pt-2">
                <input type="text" id="join-code" placeholder="房間代碼" 
                    class="flex-grow p-4 bg-gray-50 border-2 border-transparent focus:border-green-500 focus:bg-white rounded-2xl outline-none font-mono font-bold text-center uppercase tracking-widest">
                <button id="btn-join" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-4 rounded-2xl shadow-lg transition-all active:scale-95">
                    加入
                </button>
            </div>
            <p id="error-msg" class="text-red-500 text-sm font-bold text-center"></p>
        </div>
    </div>

    <!-- 等待室 (Waiting) -->
    <div id="waiting-view" class="hidden w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 space-y-6 text-center">
        <div>
            <p class="text-xs font-black text-gray-400 uppercase tracking-widest">邀請代碼</p>
            <h2 id="display-room-code" class="text-5xl font-black text-indigo-600">------</h2>
        </div>
        <div class="bg-slate-50 rounded-2xl p-4 text-left">
            <h3 class="text-xs font-bold text-slate-400 mb-3 flex items-center gap-2">
                <i class="fas fa-users"></i> 已連線玩家 (<span id="player-count">0</span>)
            </h3>
            <div id="player-list" class="space-y-2">
                <!-- 玩家列表會在這裡動態插入 -->
            </div>
        </div>
        <div id="host-controls" class="hidden">
            <button id="btn-start" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-5 rounded-2xl shadow-xl animate-pulse">
                開始比賽
            </button>
        </div>
        <div id="guest-waiting" class="py-4">
            <p class="text-indigo-500 font-bold italic">等待房主發號施令...</p>
        </div>
    </div>

    <!-- 遊戲進行中 (Game) -->
    <div id="game-view" class="hidden w-full max-w-4xl space-y-6 px-4">
        <!-- 排行榜進度條 -->
        <div class="bg-white/90 backdrop-blur-md shadow-xl rounded-3xl p-6 border border-white sticky top-4 z-10">
            <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4">即時戰況排行榜</h3>
            <div id="leaderboard" class="space-y-4">
                <!-- 進度條會在這裡動態更新 -->
            </div>
        </div>

        <!-- 題目區 -->
        <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12 space-y-8">
            <div class="flex justify-between items-center">
                <span id="question-number" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-xl text-xs font-black uppercase">題目 1 / 4</span>
                <div class="text-right">
                    <p class="text-[10px] font-black text-gray-400 uppercase">我的分數</p>
                    <p id="my-score-display" class="text-2xl font-black text-orange-500">0</p>
                </div>
            </div>
            <h2 id="question-text" class="text-2xl md:text-3xl font-bold text-slate-800 leading-tight">
                題目載入中...
            </h2>
            <div id="options-container" class="grid grid-cols-1 gap-4">
                <!-- 選項按鈕 -->
            </div>
        </div>
    </div>

    <!-- 結算畫面 (Results) -->
    <div id="results-view" class="hidden w-full max-w-md bg-white rounded-3xl shadow-2xl p-10 text-center space-y-8">
        <div class="w-24 h-24 bg-yellow-100 rounded-3xl flex items-center justify-center mx-auto rotate-12">
            <i class="fas fa-trophy text-yellow-600 text-4xl -rotate-12"></i>
        </div>
        <h2 class="text-4xl font-black text-gray-800">比賽終了！</h2>
        <div id="final-rankings" class="space-y-3">
            <!-- 最終排名 -->
        </div>
        <button onclick="location.reload()" class="w-full bg-slate-800 hover:bg-black text-white font-bold py-5 rounded-2xl shadow-xl transition-all">
            返回大廳
        </button>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, set, update, onValue, get, onDisconnect } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyDbkBSl5Hav7EKN8rZ2FSxyrkYcMNvjOjk",
            authDomain: "myf-game1.firebaseapp.com",
            databaseURL: "https://myf-game1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "myf-game1",
            storageBucket: "myf-game1.firebasestorage.app",
            messagingSenderId: "143330448168",
            appId: "1:143330448168:web:dcc1603dc14a20a9d7761d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const APP_ID = "bafs-racing-html-v1";

        // 題庫
        const BAFS_QUESTIONS = [
            { question: "在會計方程中，資產 (Assets) 等於：", options: ["負債 + 所有者權益", "負債 - 所有者權益", "收入 - 開支", "現金 + 存貨"], answer: 0 },
            { question: "下列哪一項是有限公司與無限公司最大的區別？", options: ["股東人數", "債務承擔責任（有限 vs 無限）", "營業額多寡", "納稅率"], answer: 1 },
            { question: "計算流動比率 (Current Ratio) 的公式是：", options: ["流動資產 / 流動負債", "總資產 / 總負債", "純利 / 營業額", "存貨 / 銷貨成本"], answer: 0 },
            { question: "下列哪項不是市場行銷 (Marketing) 的 4P 之一？", options: ["產品 (Product)", "價格 (Price)", "利潤 (Profit)", "促銷 (Promotion)"], answer: 2 }
        ];

        // 遊戲狀態變數
        let currentUser = null;
        let currentRoomCode = "";
        let currentQuestionIdx = 0;
        let myScore = 0;
        let isHost = false;

        // 視圖切換
        function showView(viewId) {
            document.querySelectorAll('body > div').forEach(div => div.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        // 初始化驗證
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                showView('lobby-view');
                initGlobalOnlineListener();
            } else {
                signInAnonymously(auth);
            }
        });

        // 全服線上人數監聽
        function initGlobalOnlineListener() {
            const roomsRef = ref(db, `artifacts/${APP_ID}/public/data/rooms`);
            onValue(roomsRef, (snapshot) => {
                const rooms = snapshot.val();
                let totalOnline = 0;
                if (rooms) {
                    Object.values(rooms).forEach(room => {
                        if (room.players) {
                            totalOnline += Object.keys(room.players).length;
                        }
                    });
                }
                document.getElementById('global-online-count').innerText = totalOnline;
            });
        }

        // 建立房間
        document.getElementById('btn-create').onclick = async () => {
            const name = document.getElementById('player-name').value.trim();
            if (!name) return alert("請輸入名稱");
            
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            currentRoomCode = code;
            isHost = true;

            const roomPath = `artifacts/${APP_ID}/public/data/rooms/${code}`;
            const roomData = {
                code: code,
                hostId: currentUser.uid,
                status: 'waiting',
                players: {
                    [currentUser.uid]: { uid: currentUser.uid, name: name, score: 0, progress: 0 }
                }
            };

            // 設定斷線自動移除
            const myPlayerRef = ref(db, `${roomPath}/players/${currentUser.uid}`);
            onDisconnect(myPlayerRef).remove();

            await set(ref(db, roomPath), roomData);
            initRoomListener(code);
            showView('waiting-view');
            document.getElementById('display-room-code').innerText = code;
            document.getElementById('host-controls').classList.remove('hidden');
            document.getElementById('guest-waiting').classList.add('hidden');
        };

        // 加入房間
        document.getElementById('btn-join').onclick = async () => {
            const name = document.getElementById('player-name').value.trim();
            const code = document.getElementById('join-code').value.trim().toUpperCase();
            if (!name || !code) return alert("請輸入名稱與代碼");

            const roomPath = `artifacts/${APP_ID}/public/data/rooms/${code}`;
            const snapshot = await get(ref(db, roomPath));
            
            if (snapshot.exists()) {
                const data = snapshot.val();
                if (data.status !== 'waiting') return alert("遊戲已在進行中");
                
                // 設定斷線自動移除
                const myPlayerRef = ref(db, `${roomPath}/players/${currentUser.uid}`);
                onDisconnect(myPlayerRef).remove();

                await update(ref(db, `${roomPath}/players`), {
                    [currentUser.uid]: { uid: currentUser.uid, name: name, score: 0, progress: 0 }
                });
                
                currentRoomCode = code;
                isHost = false;
                initRoomListener(code);
                showView('waiting-view');
                document.getElementById('display-room-code').innerText = code;
            } else {
                alert("找不到房間");
            }
        };

        // 監聽房間動態
        function initRoomListener(code) {
            const roomRef = ref(db, `artifacts/${APP_ID}/public/data/rooms/${code}`);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // 更新玩家列表
                const playersArr = Object.values(data.players || {});
                document.getElementById('player-count').innerText = playersArr.length;
                const listEl = document.getElementById('player-list');
                listEl.innerHTML = playersArr.map(p => `
                    <div class="flex items-center justify-between bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                        <span class="font-bold text-slate-700">${p.name}</span>
                        ${p.uid === data.hostId ? '<span class="text-[10px] bg-yellow-100 text-yellow-700 px-2 py-1 rounded font-black">房主</span>' : ''}
                    </div>
                `).join('');

                // 監聽遊戲開始
                if (data.status === 'playing' && document.getElementById('game-view').classList.contains('hidden')) {
                    startLocalGame();
                }

                // 遊戲中即時排行榜
                if (data.status === 'playing') {
                    updateLeaderboard(playersArr);
                }
            });
        }

        // 開始比賽 (房主點擊)
        document.getElementById('btn-start').onclick = async () => {
            await update(ref(db, `artifacts/${APP_ID}/public/data/rooms/${currentRoomCode}`), { status: 'playing' });
        };

        // 遊戲邏輯
        function startLocalGame() {
            showView('game-view');
            renderQuestion();
        }

        function renderQuestion() {
            const q = BAFS_QUESTIONS[currentQuestionIdx];
            document.getElementById('question-number').innerText = `題目 ${currentQuestionIdx + 1} / ${BAFS_QUESTIONS.length}`;
            document.getElementById('question-text').innerText = q.question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "group flex items-center p-5 border-2 border-slate-50 hover:border-indigo-500 hover:bg-indigo-50 rounded-2xl transition-all text-left font-bold text-slate-600";
                btn.innerHTML = `
                    <span class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center mr-4 group-hover:bg-indigo-500 group-hover:text-white transition-colors">${String.fromCharCode(65+i)}</span>
                    <span>${opt}</span>
                `;
                btn.onclick = () => handleAnswer(i);
                container.appendChild(btn);
            });
        }

        async function handleAnswer(idx) {
            const correct = idx === BAFS_QUESTIONS[currentQuestionIdx].answer;
            if (correct) myScore += 10;
            document.getElementById('my-score-display').innerText = myScore;

            currentQuestionIdx++;
            const progress = currentQuestionIdx / BAFS_QUESTIONS.length;

            // 同步分數到雲端
            await update(ref(db, `artifacts/${APP_ID}/public/data/rooms/${currentRoomCode}/players/${currentUser.uid}`), {
                score: myScore,
                progress: progress
            });

            if (currentQuestionIdx < BAFS_QUESTIONS.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        function updateLeaderboard(players) {
            const sorted = [...players].sort((a, b) => b.score - a.score);
            const container = document.getElementById('leaderboard');
            container.innerHTML = sorted.map(p => `
                <div class="flex items-center gap-4">
                    <div class="w-20 text-xs font-bold truncate">${p.name}</div>
                    <div class="flex-grow bg-slate-100 h-3 rounded-full overflow-hidden">
                        <div class="h-full bg-indigo-500 progress-transition" style="width: ${(p.progress || 0) * 100}%"></div>
                    </div>
                    <div class="w-10 text-right font-black text-xs text-indigo-600">${p.score}</div>
                </div>
            `).join('');
        }

        async function showResults() {
            showView('results-view');
            const snapshot = await get(ref(db, `artifacts/${APP_ID}/public/data/rooms/${currentRoomCode}/players`));
            const players = Object.values(snapshot.val() || {}).sort((a, b) => b.score - a.score);
            
            const container = document.getElementById('final-rankings');
            container.innerHTML = players.map((p, i) => `
                <div class="flex items-center justify-between p-4 rounded-2xl ${p.uid === currentUser.uid ? 'bg-indigo-50 border-2 border-indigo-200' : 'bg-slate-50'}">
                    <div class="flex items-center gap-3">
                        <span class="w-6 h-6 rounded-lg flex items-center justify-center text-xs font-black ${i === 0 ? 'bg-yellow-400 text-white' : 'bg-slate-300 text-white'}">${i+1}</span>
                        <span class="font-bold text-slate-700">${p.name}</span>
                    </div>
                    <span class="font-black text-indigo-600">${p.score} pt</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
