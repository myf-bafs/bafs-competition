<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAFS 商業大賽 - 終極對戰版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #0f172a; min-height: 100vh; color: #f8fafc; overflow-x: hidden; }
        .cartoon-panel { background: white; border: 4px solid #1e293b; border-radius: 2rem; box-shadow: 8px 8px 0px #1e293b; color: #1e293b; }
        .cartoon-btn { background: #6366f1; color: white; border: 3px solid #1e293b; border-radius: 1.25rem; box-shadow: 4px 4px 0px #1e293b; transition: all 0.1s; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .cartoon-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #1e293b; }
        .cartoon-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }
        
        /* 特效樣式 */
        .streak-pop { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .final-question-bg { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%) !important; border-color: #d97706 !important; }
        .final-text { color: #d97706; text-shadow: 0 0 10px rgba(217, 119, 6, 0.3); }
        #rank-up-alert { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100; pointer-events: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .loading-spinner { border-4 border-slate-700 border-t-indigo-500 rounded-full w-12 h-12 animate-spin; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- 排名超越提示 -->
    <div id="rank-up-alert" class="hidden">
        <div class="bg-yellow-400 border-4 border-slate-900 px-6 py-3 rounded-full shadow-2xl animate__animated animate__bounceInDown">
            <p class="text-slate-900 font-black text-lg flex items-center gap-2">
                🚀 <span id="rank-alert-text">超越了對手！</span>
            </p>
        </div>
    </div>

    <!-- 初始載入 -->
    <div id="loading-screen" class="text-center flex flex-col items-center gap-4">
        <div class="loading-spinner"></div>
        <p id="loading-msg" class="text-indigo-400 font-black text-xl animate-pulse">正在安全連線中...</p>
    </div>

    <!-- 大廳 -->
    <div id="lobby-view" class="hidden w-full max-w-md cartoon-panel p-8 space-y-6">
        <div class="text-center">
            <h1 class="text-4xl font-black text-indigo-600">BAFS 決戰</h1>
            <p class="text-slate-400 font-bold">同步對戰 · 無痕相容版</p>
        </div>
        <div class="space-y-4">
            <div class="space-y-1">
                <label class="font-black text-slate-500 text-sm ml-1">玩家名稱</label>
                <input type="text" id="player-name" placeholder="輸入暱稱" class="w-full p-4 border-4 border-slate-800 rounded-2xl font-bold text-center outline-none focus:ring-4 ring-indigo-100">
            </div>
            
            <div class="bg-indigo-50 border-4 border-slate-800 rounded-2xl p-4 flex justify-between items-center">
                <span class="font-black text-slate-700">比賽題數</span>
                <input type="number" id="question-count-input" min="1" max="35" value="10" class="w-20 border-2 border-slate-800 rounded-lg text-center font-black p-1">
            </div>

            <button id="btn-create" class="w-full cartoon-btn bg-indigo-500 py-4 text-xl font-black">建立新對決</button>
            <div class="relative flex items-center py-2"><div class="flex-grow border-t-2 border-slate-100"></div><span class="px-3 text-slate-300 font-bold">OR</span><div class="flex-grow border-t-2 border-slate-100"></div></div>
            <input type="text" id="join-code" placeholder="輸入 6 位代碼" maxlength="6" class="w-full p-4 border-4 border-slate-800 rounded-2xl font-black text-center uppercase tracking-widest outline-none focus:border-emerald-500">
            <button id="btn-join" class="w-full cartoon-btn bg-emerald-400 text-slate-800 py-4 text-xl font-black">加入比賽</button>
        </div>
    </div>

    <!-- 等待室 -->
    <div id="waiting-view" class="hidden w-full max-w-md cartoon-panel p-8 text-center space-y-6">
        <div>
            <p class="text-slate-400 font-black text-xs uppercase">邀請代碼</p>
            <h2 id="display-room-code" class="text-6xl font-black text-indigo-600 tracking-tighter font-mono">------</h2>
        </div>
        <div class="bg-slate-50 rounded-3xl p-6 border-2 border-slate-100">
            <p id="player-count-text" class="text-xs font-black text-slate-400 mb-3 uppercase tracking-widest">準備中的玩家 (0)</p>
            <div id="player-list" class="flex flex-wrap gap-2 justify-center"></div>
        </div>
        <div id="host-controls" class="hidden">
            <button id="btn-start" class="w-full cartoon-btn bg-yellow-400 text-slate-800 py-5 text-2xl font-black animate-pulse">全員到齊，開戰！</button>
        </div>
        <div id="guest-waiting" class="hidden">
            <p class="font-black text-indigo-400 animate-pulse italic">等待主持人發號施令...</p>
        </div>
    </div>

    <!-- 遊戲中 -->
    <div id="game-view" class="hidden w-full max-w-5xl space-y-4">
        <div id="leaderboard" class="flex gap-3 overflow-x-auto no-scrollbar py-2"></div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div id="play-area" class="lg:col-span-3 cartoon-panel p-6 lg:p-10 relative overflow-hidden transition-all duration-500">
                <div class="flex justify-between items-center mb-8 border-b-2 border-slate-50 pb-4">
                    <span id="question-number" class="bg-slate-800 text-white px-4 py-1 rounded-full font-black">Q1</span>
                    <div id="streak-badge" class="hidden streak-pop bg-orange-500 text-white px-4 py-1 rounded-full font-black italic shadow-lg">
                        STREAK × <span id="streak-count">0</span>
                    </div>
                </div>

                <div id="question-content">
                    <h2 id="question-text" class="text-2xl lg:text-3xl font-black mb-8 leading-tight"></h2>
                    <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>

                <div id="wait-message" class="hidden py-20 text-center animate__animated animate__fadeIn">
                    <div class="loading-spinner mx-auto mb-4 border-t-indigo-400"></div>
                    <h3 class="text-2xl font-black text-indigo-600">已提交答案！</h3>
                    <p class="text-slate-400 font-bold">請稍候，正監視其他選手的動向...</p>
                </div>

                <div id="mid-rank-box" class="hidden py-10 text-center animate__animated animate__zoomIn">
                    <h3 class="text-3xl font-black text-indigo-600 mb-6 italic">本題戰報</h3>
                    <div id="mid-rank-list" class="max-w-sm mx-auto space-y-3"></div>
                </div>
            </div>

            <div class="space-y-4">
                <div class="cartoon-panel p-6 text-center bg-indigo-600 border-indigo-900">
                    <p class="text-indigo-200 font-black text-xs">個人得分</p>
                    <p id="my-score-display" class="text-5xl font-black text-white">0</p>
                </div>
                <div class="cartoon-panel p-6 text-center bg-white">
                    <p class="text-slate-400 font-black text-xs uppercase">目前排名</p>
                    <p id="my-rank-display" class="text-6xl font-black text-indigo-600">#1</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 結算 -->
    <div id="results-view" class="hidden w-full max-w-md cartoon-panel p-10 text-center space-y-8 relative">
        <div id="winner-crown" class="animate__animated animate__bounceInDown">
            <i class="fas fa-crown text-7xl text-yellow-400"></i>
        </div>
        <h2 class="text-4xl font-black text-indigo-600">榮耀時刻</h2>
        <div id="final-rankings" class="space-y-4 text-left"></div>
        <button onclick="location.reload()" class="w-full cartoon-btn py-5 text-xl font-black bg-indigo-600 text-white">返回大廳</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, setPersistence, inMemoryPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, set, update, onValue, get, onDisconnect } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbkBSl5Hav7EKN8rZ2FSxyrkYcMNvjOjk",
            authDomain: "myf-game1.firebaseapp.com",
            databaseURL: "https://myf-game1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "myf-game1",
            storageBucket: "myf-game1.firebasestorage.app",
            messagingSenderId: "143330448168",
            appId: "1:143330448168:web:dcc1603dc14a20a9d7761d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const APP_ID = "BAFS_ULTIMATE_PVP_V1"; // 統一固定路徑

        // 核心設定：無痕相容
        setPersistence(auth, inMemoryPersistence);

        const BANK = [
            {"q": "下列哪項是「管理」的正確定義？", "a": ["訂立組織目標，並制定最佳方案來達成這些目標的過程", "透過計劃、組織、領導和控制四項功能以達成組織目標的過程", "決定須要做哪些工作，以及如何把這些工作組合起來的過程", "引導、指示和激勵員工達成組織目標的過程"], "correct": 1},
            {"q": "計劃對企業十分重要，因為它可以： (1) 幫助管理人員尋找機會和應對挑戰 (2) 為員工提供指引 (3) 作為監控工作進度的標準", "a": ["只有 (1) 和 (2)", "只有 (1) 和 (3)", "只有 (2) 和 (3)", "(1)、(2) 和 (3)"], "correct": 3},
            {"q": "在良好目標的「SMART」規則中，「可量度」是指：", "a": ["目標必須清楚明確說明要達達到結果", "目標應可量化或以數字形式表達，以量度企業的實際表現", "目標應該既富挑戰性，又可憑着額外的努力達成", "目標應針對影響企業業績的關鍵因素"], "correct": 1},
            {"q": "下列哪項是「前線管理人員」的工作例子？", "a": ["制定公司的願景和使命", "制定公司政策和策略", "處理顧客投訴", "訂立公司的整體目標和方向"], "correct": 2}
        ];

        let currentUser = null;
        let currentRoomCode = "";
        let isHost = false;
        let myScore = 0;
        let streak = 0;
        let lastRank = 1;
        let unsubRoom = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                showView('lobby-view');
                document.getElementById('loading-screen').classList.add('hidden');
            } else {
                signInAnonymously(auth).catch(() => {
                    document.getElementById('loading-msg').innerText = "連線異常，請檢查網路。";
                });
            }
        });

        function showView(id) {
            document.querySelectorAll('body > div').forEach(v => v.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function vibrate(ms = 50) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        function triggerOvertake(targetName) {
            const el = document.getElementById('rank-up-alert');
            document.getElementById('rank-alert-text').innerText = `超越了 ${targetName}！`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 2500);
        }

        // 建立房間
        document.getElementById('btn-create').onclick = async () => {
            const name = document.getElementById('player-name').value.trim();
            const count = parseInt(document.getElementById('question-count-input').value) || 10;
            if (!name) return alert("請輸入暱稱");

            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            currentRoomCode = code;
            isHost = true;

            const roomRef = ref(db, `artifacts/${APP_ID}/public/data/rooms/${code}`);
            await set(roomRef, {
                code, status: 'waiting', hostId: currentUser.uid, currQ: 0, sync: 'asking', 
                qCount: Math.min(count, BANK.length),
                players: { [currentUser.uid]: { name, score: 0, answered: false, streak: 0 } }
            });

            onDisconnect(ref(db, `artifacts/${APP_ID}/public/data/rooms/${code}/players/${currentUser.uid}`)).remove();
            initRoomListener(code);
            showView('waiting-view');
            document.getElementById('host-controls').classList.remove('hidden');
            document.getElementById('guest-waiting').classList.add('hidden');
        };

        // 加入房間 (含搜尋重試邏輯)
        document.getElementById('btn-join').onclick = async () => {
            const name = document.getElementById('player-name').value.trim();
            const code = document.getElementById('join-code').value.trim().toUpperCase();
            if (!name || code.length < 5) return alert("請輸入完整名稱與代碼");

            document.getElementById('btn-join').disabled = true;
            document.getElementById('btn-join').innerText = "搜尋中...";

            const roomRef = ref(db, `artifacts/${APP_ID}/public/data/rooms/${code}`);
            let snap = await get(roomRef);
            
            // 重試邏輯：避免時差
            if (!snap.exists()) {
                await new Promise(r => setTimeout(r, 800));
                snap = await get(roomRef);
            }

            if (!snap.exists()) {
                alert("找不到房間，請確認代碼是否正確");
                document.getElementById('btn-join').disabled = false;
                document.getElementById('btn-join').innerText = "加入比賽";
                return;
            }

            const data = snap.val();
            if (data.status !== 'waiting') {
                alert("比賽已在進行中");
                document.getElementById('btn-join').disabled = false;
                document.getElementById('btn-join').innerText = "加入比賽";
                return;
            }

            await update(ref(db, `artifacts/${APP_ID}/public/data/rooms/${code}/players`), {
                [currentUser.uid]: { name, score: 0, answered: false, streak: 0 }
            });

            onDisconnect(ref(db, `artifacts/${APP_ID}/public/data/rooms/${code}/players/${currentUser.uid}`)).remove();
            currentRoomCode = code;
            initRoomListener(code);
            showView('waiting-view');
            document.getElementById('guest-waiting').classList.remove('hidden');
            document.getElementById('host-controls').classList.add('hidden');
            document.getElementById('btn-join').disabled = false;
        };

        function initRoomListener(code) {
            if (unsubRoom) unsubRoom();
            unsubRoom = onValue(ref(db, `artifacts/${APP_ID}/public/data/rooms/${code}`), (s) => {
                const data = s.val();
                if (!data) return;

                document.getElementById('display-room-code').innerText = code;
                const players = Object.values(data.players || {});
                document.getElementById('player-count-text').innerText = `準備中的玩家 (${players.length})`;
                document.getElementById('player-list').innerHTML = players.map(p => `
                    <div class="bg-indigo-100 text-indigo-700 px-4 py-1 rounded-full font-black animate__animated animate__fadeIn">
                        ${p.name}
                    </div>
                `).join('');

                if (data.status === 'playing') {
                    showView('game-view');
                    syncGame(data, players);
                } else if (data.status === 'finished') {
                    showFinal(players);
                }
            });
        }

        function syncGame(data, players) {
            const me = data.players[currentUser.uid];
            if (!me) return;

            const sorted = [...players].sort((a,b) => b.score - a.score);
            const myRank = sorted.findIndex(p => p.name === me.name) + 1;
            
            if (myRank < lastRank) {
                const target = sorted[myRank] ? sorted[myRank].name : "對手";
                triggerOvertake(target);
            }
            lastRank = myRank;

            document.getElementById('my-score-display').innerText = me.score;
            document.getElementById('my-rank-display').innerText = `#${myRank}`;
            document.getElementById('streak-count').innerText = me.streak || 0;
            document.getElementById('streak-badge').classList.toggle('hidden', (me.streak || 0) < 2);

            // 排行榜橫桿
            document.getElementById('leaderboard').innerHTML = sorted.map((p,i) => `
                <div class="flex-shrink-0 flex items-center gap-2 bg-white border-2 border-slate-800 px-4 py-2 rounded-full shadow-sm">
                    <span class="font-black text-indigo-600">${i+1}.</span>
                    <span class="font-bold text-slate-800 truncate max-w-[80px]">${p.name}</span>
                    <span class="bg-slate-100 px-2 rounded-full text-xs font-black">${p.score}</span>
                </div>
            `).join('');

            const panel = document.getElementById('play-area');
            const isFinal = data.currQ === data.qCount - 1;

            if (data.sync === 'asking') {
                document.getElementById('question-content').classList.remove('hidden');
                document.getElementById('mid-rank-box').classList.add('hidden');
                
                if (isFinal) {
                    panel.classList.add('final-question-bg');
                    document.getElementById('question-number').innerHTML = `<span class="final-text">🏆 FINAL QUESTION</span>`;
                    document.getElementById('question-number').className = "bg-yellow-400 text-slate-900 px-6 py-2 rounded-full font-black animate-pulse";
                } else {
                    panel.classList.remove('final-question-bg');
                    document.getElementById('question-number').innerText = `第 ${data.currQ + 1} 題`;
                    document.getElementById('question-number').className = "bg-slate-800 text-white px-4 py-1 rounded-full font-black";
                }

                renderQuestion(data.currQ, me.answered);

                if (isHost && players.every(p => p.answered)) {
                    setTimeout(() => update(ref(db, `artifacts/${APP_ID}/public/data/rooms/${currentRoomCode}`), { sync: 'ranking' }), 1200);
                }
            } else {
                document.getElementById('question-content').classList.add('hidden');
                document.getElementById('wait-message').classList.add('hidden');
                document.getElementById('mid-rank-box').classList.remove('hidden');
                
                document.getElementById('mid-rank-list').innerHTML = sorted.slice(0, 5).map((p,i) => `
                    <div class="flex justify-between p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-black animate__animated animate__fadeInUp" style="animation-delay: ${i*0.1}s">
                        <span>${i+1}. ${p.name}</span>
                        <span class="text-indigo-600">${p.score} PT</span>
                    </div>
                `).join('');

                if (isHost) {
                    setTimeout(() => {
                        const next = data.currQ + 1;
                        if (next < data.qCount) {
                            const upds = { currQ: next, sync: 'asking' };
                            Object.keys(data.players).forEach(uid => upds[`players/${uid}/answered`] = false);
                            update(ref(db, `artifacts/${APP_ID}/public/data/rooms/${currentRoomCode}`), upds);
                        } else {
                            update(ref(db, `artifacts/${APP_ID}/public/data/rooms/${currentRoomCode}`), { status: 'finished' });
                        }
                    }, 4500);
                }
            }
        }

        function renderQuestion(idx, answered) {
            const q = BANK[idx % BANK.length];
            document.getElementById('question-text').innerText = q.q;
            const container = document.getElementById('options-container');
            const waitMsg = document.getElementById('wait-message');

            if (answered) {
                document.getElementById('question-content').classList.add('hidden');
                waitMsg.classList.remove('hidden');
            } else {
                document.getElementById('question-content').classList.remove('hidden');
                waitMsg.classList.add('hidden');
                container.innerHTML = '';
                q.a.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = "cartoon-btn bg-white text-slate-800 p-5 font-bold text-left border-4 border-slate-800 hover:scale-[1.02] transform transition-all leading-tight";
                    btn.innerHTML = `<span class="bg-slate-800 text-white w-7 h-7 inline-flex items-center justify-center rounded-full mr-3 text-xs">${String.fromCharCode(65+i)}</span> ${opt}`;
                    btn.onclick = async () => {
                        const isCorrect = i === q.correct;
                        vibrate(isCorrect ? 60 : 200);
                        
                        if (isCorrect) {
                            streak++;
                            myScore += (100 + (streak * 10)); 
                        } else {
                            streak = 0;
                        }

                        await update(ref(db, `artifacts/${APP_ID}/public/data/rooms/${currentRoomCode}/players/${currentUser.uid}`), {
                            score: myScore, answered: true, streak: streak
                        });
                    };
                    container.appendChild(btn);
                });
            }
        }

        document.getElementById('btn-start').onclick = () => {
            update(ref(db, `artifacts/${APP_ID}/public/data/rooms/${currentRoomCode}`), { status: 'playing' });
        };

        function showFinal(players) {
            showView('results-view');
            const sorted = [...players].sort((a,b) => b.score - a.score);
            
            // 噴發煙火
            const end = Date.now() + 5000;
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#6366f1', '#facc15'] });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#6366f1', '#facc15'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());

            document.getElementById('final-rankings').innerHTML = sorted.map((p,i) => `
                <div class="p-4 border-4 border-slate-800 rounded-2xl flex justify-between font-black items-center ${i===0?'bg-yellow-400 scale-105 shadow-2xl':'bg-white'} animate__animated animate__backInLeft" style="animation-delay: ${i*0.2}s">
                    <span class="text-xl">${i===0?'👑':i+1+'.'} ${p.name}</span>
                    <span class="text-2xl">${p.score}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
