<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAFS 商業大賽 - 修正穩定版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: linear-gradient(135deg, #7dd3fc 0%, #c4b5fd 100%); min-height: 100vh; color: #1e293b; }
        .cartoon-panel { background: white; border: 4px solid #1e293b; border-radius: 2rem; box-shadow: 8px 8px 0px #1e293b; }
        .cartoon-btn { background: #6366f1; color: white; border: 3px solid #1e293b; border-radius: 1.25rem; box-shadow: 4px 4px 0px #1e293b; transition: all 0.1s; }
        .cartoon-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #1e293b; }
        .hidden { display: none !important; }
        .progress-bar-container { background: #e2e8f0; border: 3px solid #1e293b; border-radius: 1rem; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #60a5fa, #a855f7); border-right: 3px solid #1e293b; transition: width 0.5s ease; }
        .text-stroke { -webkit-text-stroke: 1.5px #1e293b; paint-order: stroke fill; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- 載入中 -->
    <div id="loading-screen" class="text-center">
        <p class="text-indigo-900 font-black text-xl animate-pulse">正在連接商業網絡...</p>
    </div>

    <!-- 大廳 -->
    <div id="lobby-view" class="hidden w-full max-w-md cartoon-panel p-8 space-y-6">
        <div class="text-center">
            <h1 class="text-4xl font-black text-stroke text-white">BAFS 商業對決</h1>
            <p class="text-indigo-800 text-sm font-bold mt-2">在線人數：<span id="global-online-count">0</span></p>
        </div>
        <div class="space-y-4">
            <input type="text" id="player-name" placeholder="輸入你的暱稱" class="w-full p-4 border-4 border-slate-800 rounded-2xl font-bold text-center">
            <div class="flex items-center justify-between p-4 bg-indigo-50 border-4 border-slate-800 rounded-2xl">
                <span class="font-black text-slate-700">比賽題數 (1-35)</span>
                <input type="number" id="question-count-input" min="1" max="35" value="10" class="w-20 border-3 border-slate-800 rounded-lg text-center font-black">
            </div>
            <button id="btn-create" class="w-full cartoon-btn bg-indigo-500 py-4 text-xl font-black">建立房間</button>
            <div class="relative flex items-center py-2"><div class="flex-grow border-t-4 border-slate-200"></div><span class="px-4 text-slate-400 font-black">或</span><div class="flex-grow border-t-4 border-slate-200"></div></div>
            <input type="text" id="join-code" placeholder="房間代碼" class="w-full p-3 border-4 border-slate-800 rounded-2xl font-black text-center uppercase">
            <button id="btn-join" class="w-full cartoon-btn bg-emerald-400 text-slate-800 py-4 text-xl font-black">加入比賽</button>
        </div>
    </div>

    <!-- 等待室 -->
    <div id="waiting-view" class="hidden w-full max-w-md cartoon-panel p-10 space-y-8 text-center relative">
        <h2 id="display-room-code" class="text-5xl font-black text-indigo-600 tracking-widest">------</h2>
        <p id="display-q-count" class="text-sm font-black bg-yellow-100 px-3 py-1 rounded-full inline-block">題數：載入中</p>
        <div class="bg-indigo-50 rounded-3xl p-6 border-4 border-indigo-100">
            <h3 class="text-xs font-black text-indigo-400 uppercase mb-4">準備中的玩家 (<span id="player-count">0</span>)</h3>
            <div id="player-list" class="space-y-2"></div>
        </div>
        <div id="host-controls" class="hidden">
            <button id="btn-start" class="w-full cartoon-btn bg-yellow-400 text-slate-800 py-5 text-2xl font-black">開始派對</button>
        </div>
        <p id="guest-waiting" class="font-black text-indigo-400 animate-pulse">等待村長發號施令...</p>
    </div>

    <!-- 遊戲中 -->
    <div id="game-view" class="hidden w-full max-w-5xl space-y-6">
        <div class="cartoon-panel p-4"><div id="leaderboard" class="space-y-2"></div></div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div id="question-box" class="lg:col-span-2 cartoon-panel p-8 space-y-6">
                <div class="flex justify-between items-center">
                    <span id="question-number" class="bg-indigo-600 text-white px-4 py-1 rounded-full font-black">Q1</span>
                    <span id="timer-text" class="text-3xl font-black text-indigo-600 font-mono">30</span>
                </div>
                <h2 id="question-text" class="text-2xl font-black text-slate-800">載入題目中...</h2>
                <div id="options-container" class="grid grid-cols-1 gap-4"></div>
                <div id="wait-message" class="hidden text-center py-10 bg-indigo-50 rounded-2xl border-4 border-dashed border-indigo-200">
                    <p class="text-indigo-400 font-black text-xl">已提交答案，等待其他玩家...</p>
                </div>
            </div>
            <div id="mid-rank-box" class="hidden lg:col-span-2 cartoon-panel p-8 text-center space-y-6">
                <h3 class="text-3xl font-black text-indigo-600 italic">本題排名快報</h3>
                <div id="mid-rank-list" class="space-y-3"></div>
            </div>
            <div class="cartoon-panel p-8 flex flex-col items-center justify-center text-center space-y-4">
                <p class="text-slate-400 font-black">目前得分</p>
                <p id="my-score-display" class="text-5xl font-black text-orange-500">0</p>
                <p class="text-slate-400 font-black">排名</p>
                <div id="my-rank-display" class="text-6xl font-black text-stroke text-white text-indigo-600">#1</div>
            </div>
        </div>
    </div>

    <!-- 結果 -->
    <div id="results-view" class="hidden w-full max-w-md cartoon-panel p-10 text-center space-y-6">
        <h2 class="text-4xl font-black text-indigo-600">大賽結束！</h2>
        <div id="final-rankings" class="space-y-4"></div>
        <button onclick="location.reload()" class="w-full cartoon-btn py-4 font-black">返回大廳</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, set, update, onValue, get, onDisconnect } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbkBSl5Hav7EKN8rZ2FSxyrkYcMNvjOjk",
            authDomain: "myf-game1.firebaseapp.com",
            databaseURL: "https://myf-game1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "myf-game1",
            storageBucket: "myf-game1.firebasestorage.app",
            messagingSenderId: "143330448168",
            appId: "1:143330448168:web:dcc1603dc14a20a9d7761d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const APP_ID = "bafs-sync-game-v2";

        const BANK = [
            {"q": "下列哪項是「管理」的正確定義？", "a": ["訂立組織目標，並制定最佳方案來達成這些目標的過程", "透過計劃、組織、領導和控制四項功能以達成組織目標的過程", "決定須要做哪些工作，以及如何把這些工作組合起來的過程", "引導、指示和激勵員工達成組織目標的過程"], "correct": 1, "exp": "1.B"},
            {"q": "計劃對企業十分重要，因為它可以： (1) 幫助管理人員尋找機會和應對挑戰 (2) 為員工提供指引 (3) 作為監控工作進度的標準", "a": ["只有 (1) 和 (2)", "只有 (1) 和 (3)", "只有 (2) 和 (3)", "(1)、(2) 和 (3)"], "correct": 3, "exp": "2. D"},
            {"q": "在良好目標的「SMART」規則中，「可量度」是指：", "a": ["目標必須清楚明確說明要達達到結果", "目標應可量化或以數字形式表達，以量度企業的實際表現", "目標應該既富挑戰性，又可憑着額外的努力達成", "目標應針對影響企業業績的關鍵因素"], "correct": 1, "exp": "3. B"},
            {"q": "下列哪項是「前線管理人員」的工作例子？", "a": ["制定公司的願景和使命", "制定公司政策和策略", "處理顧客投訴", "訂立公司的整體目標和方向"], "correct": 2, "exp": "4. C"},
            {"q": "關於「幕僚職權」，下列哪項描述是正確的？", "a": ["讓他可以向直屬下級（下屬）發出工作指令", "衍生出從屬關係", "擁有此職權的管理人員可以指導和監督下屬", "企業授予一些特定工作職位的權力，這些職位為其他部門提供支援、協助和意見"], "correct": 3, "exp": "5. D"},
            {"q": "哪種領導風格的管理人員不讓下屬參與決策，並自行作出所有決策？", "a": ["獨裁式領導", "參與式領導", "自由放任式領導", "民主式領導"], "correct": 0, "exp": "6.A"},
            {"q": "採用「參與式領導」的其中一項壞處是：", "a": ["員工失去工作動力", "降低營運效率", "為工作間帶來混難", "視野狹窄"], "correct": 1, "exp": "7. B"},
            {"q": "「控制」過程的第一步是：", "a": ["量度實際表現", "比較實際表現與標準", "訂立表現標準", "分析差異並採取糾正行動"], "correct": 2, "exp": "8. C"},
            {"q": "下列哪項是有效管理原則中「分工」的優點？", "a": ["減低工作滿足感", "牽一髮而動全身", "靈活度低", "提升效率"], "correct": 3, "exp": "9. D"},
            {"q": "「統一命令」原則是指：", "a": ["企業內每個計劃都只由一名管理人員統領", "所有擁有相同目標的活動都應納入同一項計劃內", "每名員工只聽從一名上司的指揮，並只向他一人匯報", "把組織的整體目標轉化成個別單位、部門和員工的工作目標"], "correct": 2, "exp": "10. C"},
            {"q": "根據「職權相稱原則」：", "a": ["職權和責任是相輔相成的，而且兩者必須平衡", "管理人員可以授權下屬完成某項工作，但無須負責", "責任是組織賦予在位者的正式和合法權力", "職權是員工完成獲委派職務的義務"], "correct": 0, "exp": "11. A"},
            {"q": "「目標管理」是指：", "a": ["上司委派工作給下屬，並把正式的職權和責任轉移到下屬身上", "把組織的整體目標轉化成個別單位、部門和員工的工作目標", "對各項活動進行監控，以確保活動按計劃完成", "決定須要做哪些工作，以及如何把這些工作組合起來"], "correct": 1, "exp": "12. B"},
            {"q": "管理的重要性包括： (1) 幫助企業有效地達成組織目標 (2) 確保企業有效地使用資源", "a": ["只有 (1)", "只有 (2)", "(1) 和 (2)", "以上皆不是"], "correct": 2, "exp": "13. C"},
            {"q": "採用「自由放任式領導」的好處包括：", "a": ["決策迅速", "拓寬管理人員的視野", "加強員工對公司政策的支持", "鼓勵創新"], "correct": 3, "exp": "14. D"},
            {"q": "採用「統一的方向」的好處是：", "a": ["節省培訓員工的時間", "避免部門之間發生衝突", "減少工作延誤", "促進自動化"], "correct": 1, "exp": "15. B"},
            {"q": "人力資源管理的定義包括以下哪項？", "a": ["只負責招聘員工", "獲取和培訓僱員、評核表現、提供報酬，以及處理僱員關係和福祉", "只負責計算薪金", "只負責處理投訴"], "correct": 1, "exp": "人力資源管理是獲取和培訓僱員、評核表現的過程。"},
            {"q": "以下哪項是人力資源管理的角色？", "a": ["進行財務分析", "人力規劃", "設計生產程序", "進行市場研究"], "correct": 1, "exp": "人力規劃是人力資源管理的角色。"},
            {"q": "財務管理的目標是甚麼？", "a": ["為顧客創造最大價值", "為東主賺取最大的財富", "為員工提供最佳福利", "為社會作出最大貢獻"], "correct": 1, "exp": "財務目標是為東主賺取財富。"},
            {"q": "以下哪項屬於財務管理中的「營運資金決策」？", "a": ["選擇融資方式", "管理現金、應收帳款、應付帳款和存貨", "選取投資項目", "利用會計比率評估業績"], "correct": 1, "exp": "營運資金決策包含流動資產管理。"},
            {"q": "營運管理的定義是甚麼？", "a": ["管理企業的財務資源", "管理營運系統以及管理將投入轉化為產出的過程", "管理企業的人力資源", "管理企業的市場營銷活動"], "correct": 1, "exp": "營運管理是管理投入轉產出。"},
            {"q": "以下哪項屬於營運管理的角色？", "a": ["進行市場研究", "制定報酬制度", "品質保證", "管理顧客關係"], "correct": 2, "exp": "品質保證是營運管理角色。"},
            {"q": "市場營銷管理的定義強調：", "a": ["只專注於產品定價", "確認顧客的需要並執行策略，比對手更能滿足需要", "只負責廣告宣傳", "只管理分銷渠道"], "correct": 1, "exp": "市場營銷旨在滿足顧客需要。"},
            {"q": "以下哪項是市場營銷管理的角色？", "a": ["存貨管理", "進行財務分析", "劃分市場、選定目標市場並決定市場定位", "設計生產程序"], "correct": 2, "exp": "STP是市場營銷核心。"},
            {"q": "資訊管理的定義是：", "a": ["只負責建立網站", "透過收集、處理、儲存和傳遞資訊，以支援企業運作和決策的過程", "只負責保養電腦硬件", "只負責數據備份"], "correct": 1, "exp": "資訊管理支援決策。"},
            {"q": "以下哪項是資訊管理的角色？", "a": ["建立和維護資訊系統，以支援其他部門", "招聘員工", "制定市場營銷策略", "管理存貨"], "correct": 0, "exp": "維護系統是資訊管理角色。"},
            {"q": "風險管理的定義是：", "a": ["只購買保險", "識別和評估潛在風險並制定措施以減少損失的過程", "只避免所有風險", "只承擔所有風險"], "correct": 1, "exp": "風險管理旨在減少損失。"},
            {"q": "以下哪項屬於風險管理的策略？", "a": ["風險迴避", "品質保證", "市場研究", "員工培訓"], "correct": 0, "exp": "迴避、承擔、減少、轉移。"},
            {"q": "根據筆記，商業功能之間的關係是：", "a": ["互相獨立，沒有關聯", "互相支援和互相合作", "只有競爭關係", "只有從屬關係"], "correct": 1, "exp": "功能間互相關聯。"},
            {"q": "人力資源管理中「員工考績」的作用是：", "a": ["招聘員工", "設計制度以評核員工表現", "計算薪金", "處理員工投訴"], "correct": 1, "exp": "考績即評核表現。"},
            {"q": "財務管理中「進行財務分析」是利用甚麼來評估企業業績？", "a": ["市場調查報告", "會計比率", "員工滿意度調查", "顧客意見卡"], "correct": 1, "exp": "利用會計比率。"},
            {"q": "營運管理中「設計有效的生產程序」包括：", "a": ["只設計產品外觀", "計劃生產能力、選擇地點、設計流程、佈局等", "只選擇供應商", "只管理庫存"], "correct": 1, "exp": "包含地點和流程設計。"},
            {"q": "市場營銷管理中「制定市場營銷策略」包括：", "a": ["只制定價格", "產品策略、定價策略、分銷策略和推廣策略", "只制定推廣計劃", "只選擇分銷渠道"], "correct": 1, "exp": "即 4P 策略。"},
            {"q": "資訊管理的重要性包括：", "a": ["只支援決策", "支援決策、日常運作、促進溝通和合作", "只促進溝通", "只支援日常運作"], "correct": 1, "exp": "多方面支援企業。"},
            {"q": "風險管理中「控制風險」包括制定哪些策略？", "a": ["只購買保險", "風險迴避、風險承擔、風險減少和風險轉移", "只避免風險", "只承擔風險"], "correct": 1, "exp": "四種基本策略。"},
            {"q": "以下哪項是商業功能「互相支援」的例子？", "a": ["市場營銷部門自行招聘員工", "人力資源管理按其他部門的要求為其招聘員工", "財務部門自行設計生產程序", "營運部門自行制定報酬制度"], "correct": 1, "exp": "HR支援招聘。"}
        ];

        let currentUser = null;
        let currentRoomCode = "";
        let isHost = false;
        let myScore = 0;
        let timerInterval = null;
        let questionCount = 10;

        function showView(viewId) {
            document.querySelectorAll('body > div').forEach(v => v.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        onAuthStateChanged(auth, (user) => {
            if (user) { currentUser = user; showView('lobby-view'); initOnlineCounter(); }
            else signInAnonymously(auth);
        });

        function initOnlineCounter() {
            onValue(ref(db, `artifacts/${APP_ID}/public/data/online`), (s) => {
                document.getElementById('global-online-count').innerText = s.val() || 0;
            });
        }

        document.getElementById('btn-create').onclick = async () => {
            const name = document.getElementById('player-name').value.trim();
            const count = parseInt(document.getElementById('question-count-input').value) || 10;
            if (!name) return alert("請輸入暱稱");
            
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            currentRoomCode = code;
            isHost = true;
            questionCount = Math.min(count, BANK.length);

            await set(ref(db, `artifacts/${APP_ID}/public/data/rooms/${code}`), {
                code, status: 'waiting', hostId: currentUser.uid, qCount: questionCount,
                currQ: 0, sync: 'asking',
                players: { [currentUser.uid]: { name, score: 0, answered: false, progress: 0 } }
            });
            onDisconnect(ref(db, `artifacts/${APP_ID}/public/data/rooms/${code}/players/${currentUser.uid}`)).remove();
            initRoom(code);
            showView('waiting-view');
            document.getElementById('host-controls').classList.remove('hidden');
        };

        document.getElementById('btn-join').onclick = async () => {
            const name = document.getElementById('player-name').value.trim();
            const code = document.getElementById('join-code').value.trim().toUpperCase();
            if (!name || !code) return alert("請輸入暱稱及代碼");
            
            const snap = await get(ref(db, `artifacts/${APP_ID}/public/data/rooms/${code}`));
            if (!snap.exists()) return alert("房間不存在");
            if (snap.val().status !== 'waiting') return alert("比賽已開始");

            await update(ref(db, `artifacts/${APP_ID}/public/data/rooms/${code}/players`), {
                [currentUser.uid]: { name, score: 0, answered: false, progress: 0 }
            });
            currentRoomCode = code;
            initRoom(code);
            showView('waiting-view');
            document.getElementById('guest-waiting').classList.remove('hidden');
        };

        function initRoom(code) {
            onValue(ref(db, `artifacts/${APP_ID}/public/data/rooms/${code}`), (s) => {
                const data = s.val();
                if (!data) return;
                
                document.getElementById('display-room-code').innerText = code;
                document.getElementById('display-q-count').innerText = `題數：${data.qCount}`;
                
                const players = Object.values(data.players || {});
                document.getElementById('player-count').innerText = players.length;
                document.getElementById('player-list').innerHTML = players.map(p => `<div class="p-2 bg-white border-2 border-slate-800 rounded-xl font-bold">${p.name}</div>`).join('');

                if (data.status === 'playing') {
                    showView('game-view');
                    refreshGame(data, players);
                } else if (data.status === 'finished') {
                    showFinal(players);
                }
            });
        }

        function refreshGame(data, players) {
            const qIdx = data.currQ;
            const sync = data.sync;
            const me = data.players[currentUser.uid];

            // 更新排行榜
            const sorted = [...players].sort((a,b) => b.score - a.score);
            document.getElementById('my-rank-display').innerText = `#${sorted.findIndex(p => p.name === me.name) + 1}`;
            document.getElementById('my-score-display').innerText = me.score;
            document.getElementById('leaderboard').innerHTML = sorted.map(p => `
                <div class="flex items-center gap-2 text-xs">
                    <span class="w-12 truncate font-bold">${p.name}</span>
                    <div class="flex-grow progress-bar-container h-2"><div class="h-full progress-fill" style="width:${p.progress*100}%"></div></div>
                    <span class="font-bold">${p.score}</span>
                </div>
            `).join('');

            if (sync === 'asking') {
                document.getElementById('question-box').classList.remove('hidden');
                document.getElementById('mid-rank-box').classList.add('hidden');
                renderQuestion(qIdx, me.answered, data.qCount);
                if (isHost && players.every(p => p.answered)) {
                    update(ref(db, `artifacts/${APP_ID}/public/data/rooms/${currentRoomCode}`), { sync: 'ranking' });
                }
            } else if (sync === 'ranking') {
                document.getElementById('question-box').classList.add('hidden');
                document.getElementById('mid-rank-box').classList.remove('hidden');
                document.getElementById('mid-rank-list').innerHTML = sorted.slice(0,5).map((p,i) => `
                    <div class="flex justify-between p-3 bg-white border-2 border-slate-800 rounded-xl font-bold">
                        <span>#${i+1} ${p.name}</span><span>${p.score} PT</span>
                    </div>
                `).join('');
                if (isHost) {
                    setTimeout(async () => {
                        const next = qIdx + 1;
                        if (next < data.qCount) {
                            const updates = {};
                            players.forEach(p => {
                                const uid = Object.keys(data.players).find(key => data.players[key].name === p.name);
                                updates[`players/${uid}/answered`] = false;
                            });
                            updates.currQ = next;
                            updates.sync = 'asking';
                            update(ref(db, `artifacts/${APP_ID}/public/data/rooms/${currentRoomCode}`), updates);
                        } else {
                            update(ref(db, `artifacts/${APP_ID}/public/data/rooms/${currentRoomCode}`), { status: 'finished' });
                        }
                    }, 4000);
                }
            }
        }

        function renderQuestion(idx, answered, total) {
            const q = BANK[idx];
            if (!q) return;
            document.getElementById('question-number').innerText = `Q${idx + 1} / ${total}`;
            document.getElementById('question-text').innerText = q.q;
            const container = document.getElementById('options-container');
            const waitMsg = document.getElementById('wait-message');
            
            if (answered) {
                container.classList.add('hidden');
                waitMsg.classList.remove('hidden');
            } else {
                container.classList.remove('hidden');
                waitMsg.classList.add('hidden');
                container.innerHTML = '';
                q.a.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = "cartoon-btn bg-white text-slate-800 p-4 font-bold text-left";
                    btn.innerText = `${String.fromCharCode(65+i)}. ${opt}`;
                    btn.onclick = async () => {
                        const correct = i === q.correct;
                        const newScore = myScore + (correct ? 10 : 0);
                        myScore = newScore;
                        await update(ref(db, `artifacts/${APP_ID}/public/data/rooms/${currentRoomCode}/players/${currentUser.uid}`), {
                            score: newScore, answered: true, progress: (idx + 1) / total
                        });
                    };
                    container.appendChild(btn);
                });
            }
        }

        document.getElementById('btn-start').onclick = () => {
            update(ref(db, `artifacts/${APP_ID}/public/data/rooms/${currentRoomCode}`), { status: 'playing' });
        };

        function showFinal(players) {
            showView('results-view');
            const sorted = [...players].sort((a,b) => b.score - a.score);
            document.getElementById('final-rankings').innerHTML = sorted.map((p,i) => `
                <div class="p-4 border-4 border-slate-800 rounded-2xl flex justify-between font-black ${i===0?'bg-yellow-400':''}">
                    <span>第 ${i+1} 名 - ${p.name}</span>
                    <span>${p.score} 分</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
